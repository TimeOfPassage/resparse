services:
  metaparse:
    build: .
    image: metaparse:local
    ports:
      - "3000:3000"
    # .env 为可选：缺失时服务仍可启动，/api/health 显示 degraded（R2 未配置）
    env_file:
      - path: .env
        required: false
    # PORT / HOST / FFPROBE_PATH 的默认值由 Dockerfile 的 ENV 提供，
    # 如需覆盖，请在 .env 中设置（此处不再硬编码，避免静默覆盖 .env）。
    restart: unless-stopped
