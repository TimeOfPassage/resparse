<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MetaParse · 媒体元数据解析</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0e1116;
    --panel: #161b22;
    --panel-2: #1c2230;
    --border: #2a3140;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #4c8dff;
    --accent-2: #22c55e;
    --danger: #f85149;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(1200px 600px at 80% -10%, #1b2740 0%, transparent 60%), var(--bg);
    color: var(--text);
    font-family: var(--sans);
    line-height: 1.5;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 40px 20px 80px; }
  header h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: .2px; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  .badge {
    display: inline-block; margin-left: 10px; padding: 2px 10px; border-radius: 999px;
    font-size: 12px; font-family: var(--mono); border: 1px solid var(--border); color: var(--muted);
  }
  .card {
    margin-top: 26px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 20px;
  }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  input[type="text"] {
    flex: 1 1 320px; min-width: 220px; padding: 12px 14px; border-radius: 10px;
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    font-family: var(--mono); font-size: 14px; outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  button {
    padding: 12px 18px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--text); font-size: 14px; cursor: pointer;
    transition: transform .05s ease, border-color .15s ease, background .15s ease;
  }
  button:hover { border-color: var(--accent); }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: #3f7ceb; }
  .toolbar { margin-top: 16px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .status { font-family: var(--mono); font-size: 13px; color: var(--muted); }
  .status.ok { color: var(--accent-2); }
  .status.err { color: var(--danger); }
  .timings { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 14px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .timings b { color: var(--text); font-weight: 600; }
  pre {
    margin: 18px 0 0; padding: 16px; border-radius: 10px; overflow: auto; max-height: 60vh;
    background: #0b0f14; border: 1px solid var(--border); font-family: var(--mono);
    font-size: 12.5px; line-height: 1.55;
  }
  .hint { margin-top: 10px; font-size: 12.5px; color: var(--muted); }
  .hint code { font-family: var(--mono); color: #b7c4d6; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>MetaParse<span class="badge">Go</span></h1>
    <p>从 Cloudflare R2 读取媒体文件，调用 ffprobe 同步解析元数据并返回 JSON。</p>
  </header>

  <section class="card">
    <label for="key">R2 对象 key</label>
    <div class="row">
      <input id="key" type="text" placeholder="videos/demo.mp4" autocomplete="off" />
      <button class="primary" id="get">GET 解析</button>
      <button id="post">POST 解析</button>
    </div>
    <div class="hint">GET 走 <code>/api/metadata?key=...</code>；POST 走 <code>/api/metadata</code> 且 body 为 <code>{"key":"..."}</code>。</div>

    <div class="toolbar">
      <span id="status" class="status">待解析</span>
    </div>
    <div id="timings" class="timings" hidden></div>
    <pre id="out" hidden></pre>
  </section>
</div>

<script>
  const $key = document.getElementById('key');
  const $out = document.getElementById('out');
  const $status = document.getElementById('status');
  const $timings = document.getElementById('timings');

  function setStatus(text, kind) {
    $status.textContent = text;
    $status.className = 'status' + (kind ? ' ' + kind : '');
  }

  function renderTimings(t) {
    if (!t) { $timings.hidden = true; return; }
    $timings.hidden = false;
    $timings.innerHTML =
      '<span>head <b>' + t.headMs + 'ms</b></span>' +
      '<span>download <b>' + t.downloadMs + 'ms</b></span>' +
      '<span>probe <b>' + t.probeMs + 'ms</b></span>' +
      '<span>total <b>' + t.totalMs + 'ms</b></span>';
  }

  async function run(method) {
    const key = $key.value.trim();
    if (!key) { setStatus('请先填写对象 key', 'err'); return; }
    setStatus('解析中…');
    $out.hidden = true;
    renderTimings(null);

    const started = performance.now();
    try {
      const url = method === 'POST'
        ? '/api/metadata'
        : '/api/metadata?key=' + encodeURIComponent(key);
      const init = method === 'POST'
        ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ key }) }
        : { method: 'GET' };

      const resp = await fetch(url, init);
      const data = await resp.json();
      const ms = Math.round(performance.now() - started);

      $out.hidden = false;
      $out.textContent = JSON.stringify(data, null, 2);

      if (resp.ok) {
        setStatus('200 OK · ' + ms + 'ms', 'ok');
        if (data.timings) renderTimings(data.timings);
      } else {
        const code = data && data.error ? data.error.code : resp.status;
        setStatus(resp.status + ' ' + code + ' · ' + ms + 'ms', 'err');
      }
    } catch (err) {
      setStatus('请求失败：' + err.message, 'err');
    }
  }

  document.getElementById('get').addEventListener('click', () => run('GET'));
  document.getElementById('post').addEventListener('click', () => run('POST'));
  $key.addEventListener('keydown', (e) => { if (e.key === 'Enter') run('GET'); });
</script>
</body>
</html>
